<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Benvra — Análise Gratuita</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>

<style>

*, *::before, *::after{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --gold:#C9A84C;
  --gold-light:#E8C97A;
  --dark:#0A0C0E;
  --dark-2:#111416;
  --off:#F0EBE1;
  --muted:#8D8D8D;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--dark);
  color:var(--off);
  font-family:'DM Sans',sans-serif;
  overflow-x:hidden;
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;
}

/* NOISE */

body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity:.4;
  pointer-events:none;
}

.container{
  position:relative;
  z-index:2;
  max-width:480px;
  width:100%;
}

.glow{
  position:absolute;
  width:600px;
  height:600px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(201,168,76,.07) 0%, transparent 70%);
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:0;
  pointer-events:none;
}

.card{
  position:relative;
  z-index:2;
  background:var(--dark-2);
  border:1px solid rgba(201,168,76,.12);
  padding:60px 40px;
  text-align:center;
}

.logo{
  width:50px;
  height:50px;
  border-radius:50%;
  border:1px solid rgba(201,168,76,.25);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 30px;
  font-family:'Cormorant Garamond',serif;
  font-size:26px;
  font-weight:700;
  color:var(--gold);
}

h1{
  font-family:'Cormorant Garamond',serif;
  font-size:36px;
  line-height:1.2;
  margin-bottom:16px;
  font-weight:700;
}

h1 em{
  color:var(--gold);
  font-style:italic;
}

.subtitle{
  color:var(--muted);
  font-size:15px;
  line-height:1.6;
  margin-bottom:40px;
}

form{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.form-group{
  text-align:left;
}

label{
  display:block;
  font-size:13px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:8px;
}

input{
  width:100%;
  padding:14px 16px;
  background:rgba(201,168,76,.04);
  border:1px solid rgba(201,168,76,.15);
  color:var(--off);
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  transition:.2s;
}

input:focus{
  outline:none;
  border-color:rgba(201,168,76,.35);
  background:rgba(201,168,76,.06);
}

select{
  width:100%;
  padding:14px 16px;
  background:rgba(201,168,76,.04);
  border:1px solid rgba(201,168,76,.15);
  color:var(--off);
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  transition:.2s;
}

select:focus{
  outline:none;
  border-color:rgba(201,168,76,.35);
  background:rgba(201,168,76,.06);
}

option{
  background:var(--dark-2);
  color:var(--off);
}

button{
  background:rgba(201,168,76,.15);
  border:1px solid rgba(201,168,76,.3);
  color:var(--gold);
  padding:14px 24px;
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  font-weight:600;
  cursor:pointer;
  font-family:'DM Sans',sans-serif;
  transition:.2s;
  margin-top:12px;
}

button:hover{
  background:rgba(201,168,76,.25);
  border-color:rgba(201,168,76,.5);
}

.footer-text{
  font-size:12px;
  color:var(--muted);
  margin-top:24px;
  line-height:1.6;
}

@media(max-width:640px){
  .card{
    padding:40px 28px;
  }

  h1{
    font-size:28px;
  }

  .subtitle{
    font-size:14px;
  }
}

</style>
</head>

<body>

<div class="glow"></div>

<div class="container">

  <div class="card">

    <div class="logo">B</div>

    <h1>
      Transforme sua marca em <em>oportunidade</em>
    </h1>

    <p class="subtitle">
      Vamos analisar sua presença digital e montar uma estratégia sob medida para o seu negócio.
    </p>

    <form id="captureForm">

      <div class="form-group">
        <label for="name">Nome Completo</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          required
        />
      </div>

      <div class="form-group">
        <label for="business">Ramo do negócio</label>
        <select id="business" name="business" required>
          <option value="">Selecione uma opção</option>
          <option value="Beleza e estética">Beleza e estética</option>
          <option value="Alimentação e gastronomia">Alimentação e gastronomia</option>
          <option value="Saúde e bem-estar">Saúde e bem-estar</option>
          <option value="Consultoria e serviços">Consultoria e serviços</option>
          <option value="Educação e treinamentos">Educação e treinamentos</option>
          <option value="Imobiliário">Imobiliário</option>
          <option value="E-commerce e varejo">E-commerce e varejo</option>
          <option value="Moda e acessórios">Moda e acessórios</option>
          <option value="Outros">Outros</option>
        </select>
      </div>

      <div class="form-group">
        <label for="service">Qual serviço te interessa?</label>
        <select id="service" name="service" required>
          <option value="">Selecione uma opção</option>
          <option value="main">Tudo - Ecossistema Completo</option>
          <option value="web-design">Web Design & Desenvolvimento</option>
          <option value="organic-content">Conteúdo Orgânico</option>
          <option value="paid-traffic">Tráfego Pago</option>
          <option value="design-branding">Design & Branding</option>
        </select>
      </div>

      <button type="submit">
        Continuar
      </button>

    </form>

    <p class="footer-text">
      Seus dados são sigilosos e não serão compartilhados.
    </p>

  </div>

</div>

<script>

const nameInput = document.getElementById('name');
const businessInput = document.getElementById('business');

const storedName = localStorage.getItem('benvra_lead_name');
const storedBusiness = localStorage.getItem('benvra_lead_business');

if (storedName) {
  nameInput.value = storedName;
}

if (storedBusiness) {
  businessInput.value = storedBusiness;
}

document.getElementById('captureForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const name = document.getElementById('name').value.trim();
  const business = document.getElementById('business').value;
  const service = document.getElementById('service').value;

  if (!name || !business || !service) {
    return;
  }

  // Salvar dados em localStorage
  localStorage.setItem('benvra_lead_name', name);
  localStorage.setItem('benvra_lead_business', business);
  localStorage.setItem('benvra_lead_service', service);

  // Mapear serviço para página correta
  const servicePages = {
    'main': 'index.html',
    'web-design': 'services/web-design.html',
    'organic-content': 'services/organic-content.html',
    'paid-traffic': 'services/paid-traffic.html',
    'design-branding': 'services/design-branding.html'
  };

  const targetPage = servicePages[service] || 'index.html';

  // Redirecionar para a página apropriada
  window.location.href = targetPage;
});

</script>

</body>
</html>
